name: CI

# Dieser Check ist die Voraussetzung für Automerge:
# Renovate merged nur, wenn alle Status-Checks des PRs grün sind.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Docker-Image bauen (inkl. Maven-Build)
        run: docker build -t renovate-training:ci .

      - name: Smoke-Test
        run: docker run --rm renovate-training:ci CI
