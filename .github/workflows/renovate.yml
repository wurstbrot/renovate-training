name: Renovate

# Renovate läuft bei jedem Push auf main – im Original-Repo genauso wie in jedem Fork.
# Über "Run workflow" kann ein Lauf zusätzlich manuell gestartet werden
# (z. B. um ohne Push einen neuen Lauf anzustoßen).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Rechte für GITHUB_TOKEN (falls kein eigenes RENOVATE_TOKEN hinterlegt ist)
permissions:
  contents: write       # Branches pushen, mergen
  pull-requests: write  # PRs anlegen und aktualisieren
  issues: write         # Dependency Dashboard (Issue)
  checks: read          # Renovate liest den Status von Checks (z. B. für PR-Beschreibungen)
  statuses: read

# Nie zwei Renovate-Läufe parallel auf demselben Repo
concurrency:
  group: renovate-${{ github.repository }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.14
        with:
          # Bevorzugt ein Personal Access Token (Secret RENOVATE_TOKEN),
          # sonst das automatisch vorhandene GITHUB_TOKEN.
          token: ${{ secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          # Immer genau das Repo, in dem der Workflow läuft -> funktioniert im Fork ohne Anpassung
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Forks explizit verarbeiten
          RENOVATE_FORK_PROCESSING: enabled
          # renovate.json5 liegt bereits im Repo -> kein Onboarding-PR
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # Erlaubt Renovate, bei Gradle-Wrapper-Updates "./gradlew :wrapper" auszuführen.
          # Nur so wird die distributionSha256Sum in gradle-wrapper.properties mit aktualisiert;
          # ohne die Freigabe hätte der PR die neue Gradle-Version, aber die alte Prüfsumme.
          # "Unsafe", weil dabei Build-Code aus dem Repository mit dem Renovate-Token läuft –
          # nur für vertrauenswürdige Repositories freigeben.
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: '["gradleWrapper"]'
          LOG_LEVEL: debug
