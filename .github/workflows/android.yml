name: Android

# Baut die Android-App nur, wenn sich etwas im Ordner android/ ändert.
on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Das Android SDK ist auf den GitHub-Runnern (ubuntu-latest) vorinstalliert.
      - name: Debug-APK bauen
        run: ./gradlew --no-daemon assembleDebug
