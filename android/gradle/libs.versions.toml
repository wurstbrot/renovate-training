# Version Catalog – von Renovate über den Manager "gradle" ausgewertet.
# ABSICHTLICH VERALTET (Stand der Trainingsvorlage).
[versions]
# Android Gradle Plugin = Build-Werkzeug des Android SDK
agp = "7.4.2"
appcompat = "1.6.1"
# OkHttp 3.12.0 ist von CVE-2021-0341 betroffen (falsches Zertifikat kann akzeptiert werden)
okhttp = "3.12.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
