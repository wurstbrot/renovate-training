plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'pro.pagel.training.android'

    // ABSICHTLICH VERALTET: Android-SDK-Level (API 33 = Android 13).
    // Renovate kennt hierfür keine Datenquelle und schlägt KEIN Update vor.
    compileSdk 33

    defaultConfig {
        applicationId 'pro.pagel.training.android'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.okhttp
}
